name: Aussie Supplements CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # 1. FRONTEND CI (Next.js & TypeScript Validation)
  # -------------------------------------------------------------
  frontend-check:
    name: Frontend CI (Next.js & TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Type Checking
        run: npx tsc --noEmit

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api
          NEXT_PUBLIC_WHATSAPP_NUMBER: "94775696254"
        run: npm run build

  # -------------------------------------------------------------
  # 2. BACKEND CI (Django & Security Tests)
  # -------------------------------------------------------------
  backend-check:
    name: Backend CI (Django & Security)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Django Integrity
        env:
          DJANGO_SECRET_KEY: test-ci-secret-key-aussie-supplements-2026
          DJANGO_DEBUG: "True"
          EMAIL_HOST_USER: wpjinadhi@gmail.com
          EMAIL_HOST_PASSWORD: dummy-ci-password
        run: python manage.py check

      - name: Verify Database Migrations are Complete
        env:
          DJANGO_SECRET_KEY: test-ci-secret-key-aussie-supplements-2026
          DJANGO_DEBUG: "True"
        run: python manage.py makemigrations --check --dry-run

  # -------------------------------------------------------------
  # 3. DOCKER CONTAINER VERIFICATION
  # -------------------------------------------------------------
  docker-validation:
    name: Docker Build Validation
    needs: [ frontend-check, backend-check ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: aussie-supplements-backend:ci

      - name: Validate Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: aussie-supplements-frontend:ci
